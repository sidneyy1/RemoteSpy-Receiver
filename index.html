<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemoteSpy Receiver</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="supabase.min.js?v=1"></script>
</head>
<body>
  <header>
    <h1>RemoteSpy Receiver</h1>
    <div class="controls">
      <input id="filter" type="text" placeholder="filter path / method / args…" />
      <button id="pauseBtn">Pause</button>
      <button id="clearBtn">Clear UI</button>
      <span id="status" class="live">● LIVE</span>
    </div>
  </header>

  <main>
    <div id="boot" class="boot">starting…</div>
    <div id="feed" class="feed"></div>
  </main>

  <script>
  // Show any script error on screen (no DevTools needed on mobile).
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (b) b.textContent = 'JS error: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
  });
  </script>
  <script src="app.js?v=4" onload="window.__appLoaded=true" onerror="document.getElementById('boot').textContent='app.js FAILED TO LOAD (network or blocked)'"></script>
  <script>
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b && b.textContent === 'starting…' && !window.__appLoaded) {
      b.textContent = 'app.js did not load or did not run (blocked?)';
    }
  }, 5000);
  </script>
</body>
</html>
