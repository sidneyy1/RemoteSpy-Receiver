<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemoteSpy Receiver</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="supabase.min.js?v=1"></script>
</head>
<body>
  <header>
    <h1>RemoteSpy Receiver</h1>
    <div class="controls">
      <input id="filter" type="text" placeholder="filter path / method / args…" />

  </header>

  <main>
    <div id="boot" class="boot">starting…</div>
    <div id="feed" class="feed"></div>
  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
